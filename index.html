:root{

*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}.app-shell{max-width:760px;margin:0 auto;min-height:100vh;padding:0 18px 96px}
.topbar{position:sticky;top:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 2px 12px;background:rgba(247,247,243,.91);backdrop-filter:blur(16px)}
.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}.topbar h1{font-size:25px;margin:2px 0 0}.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:var(--shadow)}

.tabbar button{border:0;background:transparent;color:#8a8c85;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:19px}.tabbar small{font-size:11px}.tabbar button.active{color:var(--accent);font-weight:700}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px}.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:var(--muted)}
.hero{background:linear-gradient(145deg,#244f40,#3c725d);color:white;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-80px;background:rgba(255,255,255,.08)}
.hero .date{font-size:13px;opacity:.78}.hero .big{font-size:52px;font-weight:750;line-height:1;margin:16px 0 5px}.hero .sub{font-size:13px;opacity:.8}.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.hero-stat{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}.hero-stat b{display:block;font-size:22px}.hero-stat small{opacity:.75}
.primary{width:100%;border:0;border-radius:17px;padding:15px 18px;background:var(--ink);color:white;font-weight:700;font-size:15px;margin-top:14px}.primary.green{background:var(--accent)}.primary:disabled{opacity:.35}.ghost{border:1px solid var(--line);background:white;border-radius:14px;padding:10px 12px;color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini-card,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.mini-card{padding:15px}.mini-card b{font-size:22px;display:block}.mini-card small{color:var(--muted)}.card{padding:18px;margin-bottom:12px}

.metric{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric span{color:var(--muted);font-size:13px}.metric b{font-size:15px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.switch-row{display:flex;gap:8px}.switch-row button{flex:1;border:1px solid var(--line);background:white;border-radius:14px;padding:11px}.switch-row button.active{background:var(--accent-soft);border-color:#bcd3c8;color:var(--accent);font-weight:700}.danger-btn{width:100%;border:1px solid #e9c9c7;background:#fff4f3;color:var(--danger);border-radius:14px;padding:12px;margin-top:8px}.note{font-size:12px;color:var(--muted);line-height:1.6}.empty{text-align:center;color:var(--muted);padding:60px 20px}
.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);background:#222;color:#fff;border-radius:999px;padding:10px 15px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:end;z-index:40}.modal.hidden{display:none}.modal-sheet{width:min(760px,100%);margin:0 auto;background:white;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.modal-sheet h3{margin:0 0 12px}.close-row{display:flex;justify-content:flex-end}.close-x{border:0;background:#f1f2ed;width:35px;height:35px;border-radius:50%}

  <script>
(() => {
  'use strict';
  const APP_KEY='vocabflow_v1';
  const TODAY = () => {const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`};
  const DAY = 86400000;
  const new800=(window.NEW800||[]).map(x=>({...x,deck:'new800'}));
  const decks={
    new800:{id:'new800',name:'新“救命800词”',desc:'800 个结构化词条 · 考法 / 释义 / 例句 / 近义词',words:new800,ready:true},
    gre500:{id:'gre500',name:'GRE 500词汇',desc:'扫描版词表 · 已保留为下一批校对导入',words:[],ready:false}
  };
  const defaultState={
    tab:'today',settings:{deck:'new800',mode:'balanced',dailyTotal:200,dailyNew:100},
    progress:{},favorites:{},history:[],plan:null,streak:{lastDate:null,days:0}
  };
  let state=load();
  let session=null;
  let deferredInstall=null;
  const app=document.getElementById('app');
  const modal=document.getElementById('modal');
  const modalSheet=document.getElementById('modalSheet');

  function load(){try{return merge(defaultState,JSON.parse(localStorage.getItem(APP_KEY)||'{}'))}catch(e){return structuredClone(defaultState)}}
  function merge(a,b){const o={...a,...b};o.settings={...a.settings,...(b.settings||{})};o.progress=b.progress||{};o.favorites=b.favorites||{};o.history=b.history||[];o.streak={...a.streak,...(b.streak||{})};return o}
  function save(){try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){/* 预览/本地文件环境可能禁用存储；保持当前会话可用 */}}
  function words(){return decks[state.settings.deck].words}
  function byId(id){return new800.find(w=>w.id===id)}
  function dueWords(now=Date.now()){return words().filter(w=>state.progress[w.id] && state.progress[w.id].due<=now && !state.progress[w.id].suspended)}
  function newWords(){return words().filter(w=>!state.progress[w.id])}
  function learnedWords(){return words().filter(w=>state.progress[w.id])}
  function masteredWords(){return words().filter(w=>{const p=state.progress[w.id];return p&&p.reps>=3&&p.stability>=14})}
  function zh(w){return (w.senses||[]).map(s=>`${s.pos||''}${s.zh||''}`.trim()).filter(Boolean).join('；')||'暂无释义'}
  function dateLabel(){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}
  function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
  function startOfDay(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
  function addDays(days,base=Date.now()){return base+days*DAY}
  function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  function buildPlan(force=false){
    const d=decks[state.settings.deck]; if(!d.ready) return {ids:[],review:0,newCount:0,total:0};
    if(!force && state.plan && state.plan.date===TODAY() && state.plan.deck===d.id && state.plan.mode===state.settings.mode) return state.plan;
    const due=dueWords().sort((a,b)=>state.progress[a.id].due-state.progress[b.id].due);
    let n=0;
    if(state.settings.mode==='balanced') n=Math.max(0,Math.min(state.settings.dailyNew, state.settings.dailyTotal-due.length));
    else n=Math.max(0,state.settings.dailyNew);
    const fresh=newWords().slice(0,n);
    const ids=[...due.map(x=>x.id),...fresh.map(x=>x.id)];
    state.plan={date:TODAY(),deck:d.id,mode:state.settings.mode,ids,review:due.length,newCount:fresh.length,total:ids.length,done:[]};save();return state.plan;
  }
  function planRemaining(){const p=buildPlan();const done=new Set(p.done||[]);return p.ids.filter(id=>!done.has(id))}
  function todayReviews(){return state.history.filter(x=>x.date===TODAY()).length}
  function todayUnique(){return new Set(state.history.filter(x=>x.date===TODAY()).map(x=>x.id)).size}

  function reviewWord(id,rating){
    const now=Date.now();let p=state.progress[id];const isNew=!p;
    if(!p)p={reps:0,lapses:0,stability:.6,difficulty:5,due:now,learnedAt:now,lastReviewed:null,lastRating:null,suspended:false};
    p.reps+=1;
    let intervalDays=1;
    if(rating==='again'){
      p.lapses+=1;p.difficulty=Math.min(10,p.difficulty+.8);p.stability=Math.max(.3,p.stability*.45);
      p.due=now+10*60*1000;
    } else if(rating==='hard'){
      p.difficulty=Math.min(10,p.difficulty+.25);p.stability=Math.max(.8,p.stability*1.25+.25);
      intervalDays=isNew?1:Math.max(1,Math.round(p.stability));p.due=addDays(intervalDays,now);
    } else if(rating==='good'){
      p.difficulty=Math.max(1,p.difficulty-.15);p.stability=Math.max(1,p.stability*(1.75-(p.difficulty-5)*.03)+.45);
      intervalDays=isNew?3:Math.max(2,Math.round(p.stability));p.due=addDays(intervalDays,now);
    } else {
      p.difficulty=Math.max(1,p.difficulty-.5);p.stability=Math.max(2,p.stability*2.4+1);
      intervalDays=isNew?7:Math.max(5,Math.round(p.stability*1.35));p.due=addDays(intervalDays,now);
    }
    p.lastReviewed=now;p.lastRating=rating;state.progress[id]=p;
    state.history.push({id,rating,at:now,date:TODAY(),isNew,intervalDays:rating==='again'?0:intervalDays});
    if(state.history.length>5000)state.history=state.history.slice(-5000);
    const plan=buildPlan(); if(!(plan.done||[]).includes(id))plan.done.push(id);
    updateStreak();save();return {isNew,p};
  }
  function updateStreak(){
    const t=TODAY(),s=state.streak||{lastDate:null,days:0};if(s.lastDate===t)return;
    if(!s.lastDate){s.days=1}else{const diff=(startOfDay(t)-startOfDay(s.lastDate))/DAY;s.days=diff===1?s.days+1:1}
    s.lastDate=t;state.streak=s;
  }
  function startStudy(){
    const ids=planRemaining(); if(!ids.length){toast('今天的计划已经完成');return}
    session={queue:[...ids],index:0,requeues:{},shown:false,startedAt:Date.now()};renderStudy();
  }
  function currentWord(){return byId(session?.queue[session.index])}
  function rate(r){
    const w=currentWord();if(!w)return;reviewWord(w.id,r);
    if(r==='again' && (session.requeues[w.id]||0)<1){session.requeues[w.id]=(session.requeues[w.id]||0)+1;session.queue.splice(Math.min(session.index+5,session.queue.length),0,w.id)}
    if(r==='hard' && (session.requeues[w.id]||0)<1){session.requeues[w.id]=(session.requeues[w.id]||0)+1;session.queue.splice(Math.min(session.index+9,session.queue.length),0,w.id)}
    session.index++;session.shown=false;
    if(session.index>=session.queue.length){session=null;toast('本轮完成');state.tab='today';render();return}
    renderStudy();
  }

  function futurePressure(){
    const out=[];const base=startOfDay();for(let i=0;i<7;i++){const a=base+i*DAY,b=a+DAY;let c=0;for(const p of Object.values(state.progress)){if(p.due>=a&&p.due<b)c++}out.push(c)}return out;
  }

  function render(){
    document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
    if(state.tab==='today')renderToday();else if(state.tab==='words')renderWords();else if(state.tab==='stats')renderStats();else renderSettings();
  }
  function renderToday(){
    const plan=buildPlan();const remaining=planRemaining().length;const done=plan.total-remaining;const pct=plan.total?Math.round(done/plan.total*100):100;const pressure=futurePressure(),mx=Math.max(1,...pressure);
    app.innerHTML=`
      <section class="hero">
        <div class="date">${dateLabel()} · ${state.settings.mode==='balanced'?'平衡模式':'冲刺模式'}</div>
        <div class="big">${remaining}</div><div class="sub">今日待学习 · 已完成 ${done}/${plan.total}</div>
        <div class="hero-row"><div class="hero-stat"><b>${plan.review}</b><small>到期复习</small></div><div class="hero-stat"><b>${plan.newCount}</b><small>计划新词</small></div></div>
        <button class="primary" id="startBtn" ${remaining?'':'disabled'}>${remaining?'开始 / 继续学习':'今日计划已完成'}</button>
      </section>
      <div class="section-title"><h2>学习概览</h2><span>${pct}% 完成</span></div>
      <div class="grid3"><div class="mini-card"><b>${state.streak.days||0}</b><small>连续天数</small></div><div class="mini-card"><b>${learnedWords().length}</b><small>已学词汇</small></div><div class="mini-card"><b>${masteredWords().length}</b><small>已掌握</small></div></div>
      <div class="section-title"><h2>未来复习压力</h2><span>未来 7 天</span></div>
      <div class="card"><div class="pressure">${pressure.map((v,i)=>`<div class="bar-wrap"><b>${v}</b><div class="bar" style="height:${Math.max(4,v/mx*78)}px"></div><small>${i===0?'今天':i===1?'明天':new Date(Date.now()+i*DAY).getDate()+'日'}</small></div>`).join('')}</div></div>
      <div class="section-title"><h2>词库</h2><span>当前：${decks[state.settings.deck].name}</span></div>
      ${deckCard(decks.new800)}${deckCard(decks.gre500)}
    `;
    document.getElementById('startBtn')?.addEventListener('click',startStudy);
    document.querySelectorAll('[data-deck]').forEach(el=>el.addEventListener('click',()=>switchDeck(el.dataset.deck)));
  }
  function deckCard(d){return `<div class="card deck"><div class="deck-icon">${d.id==='new800'?'800':'500'}</div><div class="deck-info"><h3>${esc(d.name)}</h3><p>${esc(d.desc)}</p><span class="tag ${d.ready?'ok':''}">${d.ready?'可学习':'待校对导入'}</span></div><button class="ghost" data-deck="${d.id}">${state.settings.deck===d.id?'当前':d.ready?'切换':'查看'}</button></div>`}
  function switchDeck(id){if(!decks[id].ready){showModal(`<div class="close-row"><button class="close-x" data-close>×</button></div><h3>GRE 500词汇</h3><p class="note">这份 PDF 是扫描图片。第一版没有把 OCR 结果直接当成正式释义，避免把识别错误带进你的长期记忆。词条会在后续校对后导入；当前先用已经完整结构化的“新800词”。</p>`);return}state.settings.deck=id;state.plan=null;save();render()}

  function renderStudy(){
    const w=currentWord();if(!w){session=null;state.tab='today';render();return}const total=session.queue.length,idx=session.index+1,pct=Math.round((idx-1)/total*100);
    app.innerHTML=`<div class="study-head"><button class="ghost" id="exitStudy">退出</button><div class="progress-line"><i style="width:${pct}%"></i></div><small>${idx}/${total}</small></div>
      <div class="study-card"><div class="word">${esc(w.word)}</div><button class="speaker" id="speak">🔊 发音</button>
        ${session.shown?answerHtml(w):`<div class="hint">先在脑中回忆释义，再显示答案</div><button class="primary green" id="reveal">显示答案</button>`}
      </div>
      ${session.shown?`<div class="ratings"><button class="again" data-rate="again">忘记</button><button class="hard" data-rate="hard">模糊</button><button class="good" data-rate="good">认识</button><button class="easy" data-rate="easy">熟知</button></div>`:''}`;
    document.getElementById('exitStudy').onclick=()=>{session=null;state.tab='today';render()};document.getElementById('speak').onclick=()=>speak(w.word);
    document.getElementById('reveal')?.addEventListener('click',()=>{session.shown=true;renderStudy()});document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(b.dataset.rate));
  }
  function answerHtml(w){
    const senses=(w.senses||[]).map(s=>`<div class="sense"><strong>${esc(s.pos||'')} ${esc(s.zh||'')}</strong>${s.en?`<div class="en">${esc(s.en)}</div>`:''}</div>`).join('');
    const ex=(w.examples||[]).map(x=>`<div class="detail-text">${esc(x)}</div>`).join('');const syn=(w.synonyms||[]).map(x=>esc(x)).join('；');const der=(w.derivatives||[]).map(x=>esc(x)).join('；');
    return `<div class="answer">${senses}${ex?`<div class="label">例句</div>${ex}`:''}${syn?`<div class="label">近义词</div><div class="detail-text">${syn}</div>`:''}${der?`<div class="label">派生</div><div class="detail-text">${der}</div>`:''}</div>`
  }
  function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){toast('当前浏览器不支持发音')}}

  let wordFilter='all';
  function renderWords(){
    const list=words();app.innerHTML=`<div class="section-title"><h2>词库</h2><span>${list.length} 词</span></div><div class="search"><input id="q" placeholder="搜索单词或释义"></div><div class="chips"><button class="chip ${wordFilter==='all'?'active':''}" data-filter="all">全部</button><button class="chip ${wordFilter==='due'?'active':''}" data-filter="due">待复习</button><button class="chip ${wordFilter==='learning'?'active':''}" data-filter="learning">学习中</button><button class="chip ${wordFilter==='mastered'?'active':''}" data-filter="mastered">已掌握</button><button class="chip ${wordFilter==='fav'?'active':''}" data-filter="fav">收藏</button></div><div id="wordList"></div>`;
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{wordFilter=b.dataset.filter;renderWords()});document.getElementById('q').addEventListener('input',renderWordList);renderWordList();
  }
  function renderWordList(){
    const q=(document.getElementById('q')?.value||'').trim().toLowerCase();let list=words();
    list=list.filter(w=>{const p=state.progress[w.id];if(wordFilter==='due')return p&&p.due<=Date.now();if(wordFilter==='learning')return p&&!(p.reps>=3&&p.stability>=14);if(wordFilter==='mastered')return p&&p.reps>=3&&p.stability>=14;if(wordFilter==='fav')return !!state.favorites[w.id];return true});
    if(q)list=list.filter(w=>w.word.toLowerCase().includes(q)||zh(w).toLowerCase().includes(q));list=list.slice(0,250);
    const box=document.getElementById('wordList');if(!box)return;box.innerHTML=list.length?list.map(w=>`<div class="word-row" data-word="${w.id}"><div class="num">${String(w.order).padStart(3,'0')}</div><div class="w">${esc(w.word)}</div><div class="m">${esc(zh(w))}</div><button class="star ${state.favorites[w.id]?'on':''}" data-star="${w.id}">★</button></div>`).join(''):`<div class="empty">没有找到符合条件的词</div>`;
    box.querySelectorAll('[data-word]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-star]'))return;openWord(r.dataset.word)});box.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.favorites[b.dataset.star]=!state.favorites[b.dataset.star];save();renderWordList()})
  }
  function openWord(id){const w=byId(id),p=state.progress[id];showModal(`<div class="close-row"><button class="close-x" data-close>×</button></div><h3 style="font-size:28px">${esc(w.word)}</h3>${answerHtml(w)}<div class="label">学习状态</div><p class="note">${p?`已复习 ${p.reps} 次 · 遗忘 ${p.lapses} 次 · 下次 ${new Date(p.due).toLocaleString('zh-CN')}`:'尚未学习'}</p><button class="primary green" id="modalSpeak">🔊 发音</button>`);document.getElementById('modalSpeak').onclick=()=>speak(w.word)}

  function renderStats(){
    const ratings={again:0,hard:0,good:0,easy:0};state.history.forEach(x=>ratings[x.rating]++);const total=state.history.length,recall=total?Math.round((ratings.good+ratings.easy)/total*100):0;
    app.innerHTML=`<div class="section-title"><h2>学习统计</h2><span>本机数据</span></div><div class="grid3"><div class="mini-card"><b>${learnedWords().length}</b><small>已学习</small></div><div class="mini-card"><b>${masteredWords().length}</b><small>已掌握</small></div><div class="mini-card"><b>${recall}%</b><small>认识率</small></div></div><div class="section-title"><h2>反馈分布</h2><span>${total} 次作答</span></div><div class="card"><div class="metric"><span>忘记</span><b>${ratings.again}</b></div><div class="metric"><span>模糊</span><b>${ratings.hard}</b></div><div class="metric"><span>认识</span><b>${ratings.good}</b></div><div class="metric"><span>熟知</span><b>${ratings.easy}</b></div></div><div class="section-title"><h2>今天</h2><span>${TODAY()}</span></div><div class="card"><div class="metric"><span>复习动作</span><b>${todayReviews()}</b></div><div class="metric"><span>接触词数</span><b>${todayUnique()}</b></div><div class="metric"><span>连续学习</span><b>${state.streak.days||0} 天</b></div></div><p class="note">“已掌握”是本网页根据复习次数与记忆稳定度给出的学习状态，不代表考试中必然答对。</p>`
  }
  function renderSettings(){
    app.innerHTML=`<div class="section-title"><h2>学习设置</h2><span>自适应间隔重复</span></div><div class="card"><div class="field"><label>计划模式</label><div class="switch-row"><button data-mode="balanced" class="${state.settings.mode==='balanced'?'active':''}">平衡模式</button><button data-mode="sprint" class="${state.settings.mode==='sprint'?'active':''}">冲刺模式</button></div></div><div class="field"><label>每日总学习量（平衡模式）</label><input id="dailyTotal" type="number" min="10" max="1000" value="${state.settings.dailyTotal}"></div><div class="field"><label>${state.settings.mode==='balanced'?'每日新词上限':'每日固定新词'}</label><input id="dailyNew" type="number" min="0" max="500" value="${state.settings.dailyNew}"></div><p class="note">平衡模式：先安排所有到期复习，再用剩余容量加入新词。冲刺模式：固定加入新词，复习量额外叠加。</p></div><div class="section-title"><h2>数据</h2><span>保存在当前浏览器</span></div><div class="card"><button class="primary green" id="exportBtn">导出学习进度</button><label class="primary" style="display:block;text-align:center;cursor:pointer">导入学习进度<input id="importFile" type="file" accept="application/json" hidden></label><button class="danger-btn" id="resetBtn">清空全部学习记录</button></div><p class="note">当前版本不需要登录，进度保存在本机浏览器。换设备前请先导出进度文件。</p>`;
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.settings.mode=b.dataset.mode;state.plan=null;save();renderSettings()});
    document.getElementById('dailyTotal').onchange=e=>{state.settings.dailyTotal=Math.max(10,+e.target.value||200);state.plan=null;save()};document.getElementById('dailyNew').onchange=e=>{state.settings.dailyNew=Math.max(0,+e.target.value||0);state.plan=null;save()};
    document.getElementById('exportBtn').onclick=exportProgress;document.getElementById('importFile').onchange=importProgress;document.getElementById('resetBtn').onclick=()=>confirmReset();
  }
  function exportProgress(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`词忆学习进度-${TODAY()}.json`;a.click();URL.revokeObjectURL(a.href)}
  function importProgress(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=merge(defaultState,x.state||x);state.plan=null;save();toast('进度已导入');render()}catch(err){toast('文件格式不正确')}};r.readAsText(f)}
  function confirmReset(){showModal(`<div class="close-row"><button class="close-x" data-close>×</button></div><h3>清空学习记录？</h3><p class="note">会删除当前浏览器里的复习历史、记忆曲线和收藏。词库本身不会删除。</p><button class="danger-btn" id="confirmReset">确认清空</button>`);document.getElementById('confirmReset').onclick=()=>{state=structuredClone(defaultState);save();closeModal();render();toast('学习记录已清空')}}
  function showModal(html){modalSheet.innerHTML=html;modal.classList.remove('hidden');modalSheet.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){modal.classList.add('hidden')};modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

  document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>{session=null;state.tab=b.dataset.tab;save();render()}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').style.display='block'});
  document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}else{showModal(`<div class="close-row"><button class="close-x" data-close>×</button></div><h3>添加到手机桌面</h3><p class="note"><b>iPhone / iPad：</b>用 Safari 打开网页 → 分享 → “添加到主屏幕”。<br><br><b>电脑 / Android：</b>浏览器地址栏通常会出现“安装应用”按钮。</p>`)}});
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();

  </script>
</body>
</html>
